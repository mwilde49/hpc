# painrrf config template
#
# Field names below are pulled VERBATIM from the real CONFIG dicts in the
# research scripts (mlandi/V41/V41_Framework_Development/{04,05,06}_*.py),
# not re-invented -- per the explicit flag in docs/PRODUCTION_PACKAGING_PLAN.md.
# Placeholders (__SCRATCH__ etc.) follow the dpnvisium config.yaml convention.

# --- I/O ---
input_h5ad: __SCRATCH__/5_final_adata_neuron_v23.h5ad   # Cody atlas; see h5ad_name below
output_dir: __SCRATCH__/painrrf_output

# Which phase(s) of the numbered pipeline to run.
#   discovery       -> 04_pain_stable_panel.py   (candidate pool -> core stable panel)
#   tier_filter     -> 05_gene_evidence_tiers.py (confound-independence tiering)
#   validate        -> 06_tier1_panel_validation.py (internal LOBO validation)
#   external_check  -> 07/08/09_*.py (expression / DPN direction / spatial replication)
#   transfer        -> 10_cross_dataset_auc.py
#   all             -> run discovery -> tier_filter -> validate in sequence
stage: all

# When stage: all, also run external_check (07/08/09) + transfer (10) at the
# end. Default off: they need data/external_validation/ staged (see its
# PROVENANCE.md) and take longer (~90s combined in testing) than
# discovery+tier_filter+validate together. Explicit stage: external_check
# or stage: transfer runs them regardless of this flag. All four always
# check the FIXED historical Tier-1 seven (PMAIP1/CHST1/SMPX/BEGAIN/PCP4/
# FAM124A/RASD2), not whatever this run's own tier_filter found -- see
# painrrf.py's module docstring "EXTERNAL VALIDATION STAGES" for why.
run_external_validation: false

# --- Shared across 04/05/06 (from their CONFIG dicts) ---
seed: 1213
n_hvgs: 5000
min_cells: 10
h5ad_name: 5_final_adata_neuron_v23.h5ad

# --- 04_pain_stable_panel.py: candidate discovery ---
C_range: [0.001, 0.01, 0.1, 1.0, 10.0]
seeds: [1213, 42, 7]
view_auc_threshold: 0.80
min_global_prevalence: 0.10      # gene expressed in >=10% samples globally
min_ct_prevalence: 0.10          # gene expressed in >=10% cells in some cell type
min_within_batch_auc: 0.55
min_batches_with_auc: 2
consensus_n_subsamples: 100
consensus_sample_frac: 0.80
consensus_threshold: 0.30
top_k_per_view: 50
n_bootstrap: 100
bootstrap_top_n: 30
bootstrap_seeds_start: 10000
core_stability_threshold: 0.80
max_panel_size: 30

# --- 05_gene_evidence_tiers.py: confound-independence tiering ---
# (core_stability_threshold shared with 04, listed once above)
min_batch_n: 8                   # min samples per batch to test within-batch AUC direction
batch_dir_consistency: 0.80      # dominant-direction share required
min_batches_tested: 3            # min tested batches required
qc_strata_min_dist: 0.03         # min |AUC-0.5| in BOTH QC-high/QC-low halves
lobo_resid_min_auc: 0.55         # single-gene QC-residualized LOBO AUC floor
lobo_max_drop: 0.10              # max allowed raw-minus-residualized AUC drop
tier1_top30_inclusion: 0.50      # bootstrap top-30 inclusion frequency for Tier 1

# --- 06_tier1_panel_validation.py: internal LOBO validation ---
feature_versions: [mean, "mean+frac"]   # pb_mean only vs pb_mean + pb_frac
corr_flag: 0.80                          # redundancy flag threshold between panel genes

# --- Save/resume (mirrors dpnvisium's force_ref/force_spatial pattern) ---
force_discovery: false
force_tier_filter: false
force_validate: false
